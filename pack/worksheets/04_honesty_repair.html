<!DOCTYPE html>
<html lang="en-ZA">
<head>
<meta charset="utf-8">
<title>Honesty &amp; repair sheet — Parent Compass</title>
<style>
@page { margin: 1.5cm; }
body { font-family: Georgia, "Times New Roman", serif; color: #1f2a24; line-height: 1.45; max-width: 800px; margin: 0 auto; padding: 1.5rem; }
h1 { font-size: 1.4rem; margin: 0 0 0.25rem; color: #2c5043; }
.sub { color: #5a6b62; font-size: 0.9rem; margin: 0 0 1rem; }
.banner { background: #f8eaea; border: 1px solid #e8c9c9; color: #8b3a3a; padding: 0.6rem 0.75rem; border-radius: 8px; font-size: 0.85rem; margin-bottom: 1rem; }
label { display: block; font-weight: 700; font-size: 0.9rem; margin: 0.9rem 0 0.35rem; color: #3d6b5a; }
.line { border-bottom: 1px solid #ccc; min-height: 1.6rem; margin: 0.35rem 0; }
.box { border: 1px dashed #b7c9c0; border-radius: 8px; min-height: 4.5rem; padding: 0.5rem; margin: 0.35rem 0 0.75rem; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
.small { font-size: 0.8rem; color: #5a6b62; }
footer { margin-top: 1.5rem; font-size: 0.75rem; color: #5a6b62; border-top: 1px solid #e2ddd4; padding-top: 0.75rem; }
@media print { .noprint { display: none; } }
</style>
</head>
<body>
<p class="noprint small"><button onclick="window.print()">Print</button></p>
<h1>Honesty &amp; repair sheet</h1>
<p class="sub">Parent Compass worksheet · Adults 18+ · Not therapy or counselling</p>
<div class="banner"><strong>Safety:</strong> Abuse / violence / child in danger → call <strong>112</strong> · Childline SA <strong>116</strong> · findahelpline.com</div>

<label>What actually happened</label>
<div class="box"></div>
<label>What was hidden or untrue</label>
<div class="line"></div>
<label>How it affected someone else</label>
<div class="box"></div>
<label>Truthful ownership sentence (coach, don’t force theatre)</label>
<div class="line"></div>
<label>Repair action</label>
<div class="box"></div>
<label>Consequence (if any) that still applies — calm &amp; related</label>
<div class="line"></div>

<footer>Parent Compass — frameworks only. Not a substitute for professionals. Favourites/demo data stay on your device.</footer>
</body>
</html>
